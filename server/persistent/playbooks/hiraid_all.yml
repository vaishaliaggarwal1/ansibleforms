- name: Galahad
  hosts: localhost
  vars:
    # Connection values
    storage_serial: "{{ storage_serial }}"
    horcm_inst: "{{ horcm_inst }}"

    # port_id_task7: "CL1-E"
    # host_grp_number_task7: "1"
    # ldev_id_task7: "61473,61474"
    # lun_id_task7: "0,1"

    # storage_serial: 530642
    # horcm_inst: 1

    # state_snapshot: present
    # ldevid_task9: 61473
    # poolid_task9: 3
    # snapshot_name_task9: "test_ansible"
    # snap_mode_task9: "normal"
    # mu_task6: 3
    # svol_task9: "-1"

    # state_pool: add
    # pool_id_task2: 3
    # pool_name_task2: "test"
    # ldev_id_task2: 108, 109
    # # count_task2: "2"
    # warning_threshold_rate: "80"
    # depletion_threshold_rate: "90"

    # constants
    # format_ldev: "{{ format_ldev | default(true) | bool }}"
    # ansible_python_interpreter: "/usr/bin/python3"
    # pvol_file: "openpvol_create.facts"

  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:
    # TASK 1: Create PVOL
    - name: Creating Open PVOLs with the addmultipleopenpvols function
      openpvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: "{{ state_pvol }}"
        parity_grp_id: "{{ paritygrp_id_task1 }}"
        capacity: "{{ capacity_task1 }}"
        start_ldev: "{{ start_ldev_task1 }}"
        end_ldev: "{{ end_ldev_task1 }}"
        emulation: "{{ emulation_task1 }}"
        # base_name: "{{ base_name_task1 }}"
        # name_start: "{{ name_start_task1 }}"
        mp_blade_id: "{{ mp_blade_id_task1 | default(0) | int}}"
        format_ldevs: "{{ format_ldevs_task1 | default(true) | bool}}"
      loop_control:
        label: "Creating Open PVOLs from {{ start_ldev_task1 }} to {{ end_ldev_task1 }} with capacity {{ capacity_task1 }} in parity group ID {{ paritygrp_id_task1 }}"
      when: paritygrp_id_task1 is defined
      register: create

    - name: Debug output
      debug:
        var: create

    - name: Show created LDEVs
      debug:
        msg: "Created LDEV: {{ item.ldev_id }} (Name: {{ item.name }}, Status: {{ item.status }})"
      loop: "{{ create.pvol_facts | default([]) }}"
      when: create.pvol_facts is defined and create.pvol_facts | length > 0

    - name: Display format status summary
      debug:
        msg: |
          Format status summary:
          - Normal volumes: {{ create.format_status.normal_volumes }}
          - Blocked volumes: {{ create.format_status.blocked_volumes }}
          - Total volumes: {{ create.format_status.total_volumes }}
          {% if create.format_status.note is defined %}
          - {{ create.format_status.note }}
          {% endif %}
      when: create.format_status is defined

    - name: Display warning for LDEVs in BLK status
      debug:
        msg: |
          WARNING: Some LDEVs are in BLK (blocked) status due to ongoing formatting.
          BLK status indicates that the quick format is still in progress.
          Use the following command to check the status:
          raidcom get ldev -ldev_id {{ item.ldev_id }} -I{{ horcm_inst }} -s {{ storage_serial }}
      loop: "{{ create.pvol_facts | default([]) }}"
      when: create.pvol_facts is defined and item.status is defined and item.status == 'BLK'

    - name: Provide information on formatting
      debug:
        msg: |
          NOTE: The module now includes a polling mechanism that waits for formatting to complete.
          If volumes still show as BLK status, the formatting may take longer than the allocated polling time.
          Quick format operations run asynchronously on the storage array and will continue in the background.
          Volumes will automatically transition to NML status when formatting completes.
      when:
        # format_ldevs|bool and create.format_status.blocked_volumes|int > 0
        - format_ldevs | default(false) | bool
        - create.format_status is defined
        - create.format_status.blocked_volumes | default(0) | int > 0

    # - name: Save created Open PVOL information
    #   copy:
    #     content: "{{ create | to_nice_json }}"
    #     dest: "{{ pvol_file }}"
    #   when: create is defined and create.changed

    # TASK 2: Create POOL
    - name: Create Galahad pool
      pool:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: "{{ state_pool }}"
        pool_id: "{{ pool_id_task2}}"
        pool_name: "{{ pool_name_task2 }}"
        ldev_id: "{{ ldev_id_task2.split(',') | map('int') | list}}"
        #Optional
        cnt: "{{ count_task2 | default('') | string }}"
        # grp_opt: "{{ grp_opt_task2 }}"
        # device_grp_name: "{{ device_grp_name_task2 }}"
        user_threshold: "{{warning_threshold_rate}} {{depletion_threshold_rate}}"
      when: pool_id_task2 is defined
      register: results

    - name: Display the created Mainframe Pools
      debug:
        msg: "{{ results }}"

    # TASK 3: Create VVOLs
    - name: Creating Open VVOLs with the addmultipleopenvvols function
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: "{{ state_vvol }}"
        pool_id: "{{ pool_id_task3 }}"
        capacity: "{{ size_task3 }}"
        start_ldev: "{{ start_ldev_task3 }}"
        end_ldev: "{{ end_ldev_task3 }}"
        emulation: "{{ emulation_task3 }}"
        # base_name: "{{ base_name_task3 }}"
        # name_start: "{{ name_start_task3 }}"
      loop_control:
        label: "Creating Open VVOLs from {{ start_ldev_task3 }} to {{ end_ldev_task3 }} with capacity {{ size_task3 }}"
      when: pool_id_task3 is defined
      register: openvvol

    - name: Display created VVOLs
      debug:
        msg: "{{openvvol}}"

    # TASK 4: Create single Open VVOL using addldevnew function
    - name: Create MgmtTableVolume VVOL
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: "{{ state_single}}"
        ldev_id: "{{ ldev_id_task4 }}"
        pool_id: "{{ pool_id_task4}}"
        capacity: "{{ capacity_task4 }}" # value could be in blks (1GB = 2097152 blocks) or "1g"
      when: ldev_id_task4 is defined
      register: single_vvol

    - name: Debug output for single Open VVOL
      debug:
        msg: "{{single_vvol}}"

    # TASK 5: Modify Open VVOL using modifyldevname function
    - name: Modify MgmtTableVolume VVOL name
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: "{{ state_modify }}"
        ldev_id: "{{ ldev_id_task5 }}"
        ldev_name: "{{ ldev_name_task5 }}"
      when: ldev_id_task5 is defined
      register: modified_vvol

    - name: Debug output for modified Open VVOL
      debug:
        var: modified_vvol

    # TASK 6: Create Host Group
    - name: Create host group
      hostgroup:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: "{{ state_hostgroup }}"
        port_id: "{{ portid_task6 }}"
        host_grp_number: "{{ host_group_number_task6 }}"
        host_grp_name: "{{ host_group_name_task6 }}"
        host_mode: "{{ host_mode_task6 }}"
      loop_control:
        label: "Creating host group {{ host_group_name_task6 }} on port {{ portid_task6 }} with host group number {{ host_group_number_task6 }}"
      when: host_group_number_task6 is defined
      register: results

    - name: Display the created host group
      debug:
        msg: "{{results}}"

    # TASK 7: Add LUNs to host group
    - name: Prepare ldev_ids and luns lists
      ansible.builtin.set_fact:
        _ldev_ids_list: "{{ ldev_id_task7.split(',') | map('trim') | list }}"
        _luns_list: "{{ lun_id_task7.split(',') | map('trim') | map('int') | list }}"
      when: port_id_task7 is defined

    - name: Initialize hostgroup_lun_map
      ansible.builtin.set_fact:
        hostgroup_lun_map: []
      when: port_id_task7 is defined

    - name: Append items to hostgroup_lun_map
      ansible.builtin.set_fact:
        hostgroup_lun_map: "{{ hostgroup_lun_map + [ {'ldev_id': item.0, 'lun': item.1, 'port_id': port_id_task7, 'host_grp_number': host_grp_number_task7} ] }}"
      loop: "{{ _ldev_ids_list | zip(_luns_list) }}"
      when: port_id_task7 is defined

    - name: Show value of hostgroup_lun_map
      debug:
        var: hostgroup_lun_map

    - name: Add LUN to host group
      hostgroup_lun:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: "{{ state_lun }}"
        port_id: "{{ item.port_id }}"
        host_grp_number: "{{ item.host_grp_number }}"
        ldev_id: "{{ item.ldev_id }}"
        lun: "{{ item.lun }}"
      loop: "{{ hostgroup_lun_map }}"
      loop_control:
        label: "Adding LUN {{ item.lun }} to host group {{ item.host_grp_number }} on port {{ item.port_id }} with LDEV ID {{ item.ldev_id }}"
      when: hostgroup_lun_map is defined and port_id_task7 is defined
      register: results

    - name: Display the created host group LUN
      debug:
        msg: "{{results}}"

    # TASK 8: Add WWN to host group
    - name: Add WWN to host group
      hostgroup_wwn:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: "{{ state_wwn }}"
        port_id: "{{ port_id_task8}}"
        host_grp_number: "{{ host_grp_number_task8 }}"
        hba_wwn: "{{ hba_wwn_task8 }}"
      loop_control:
        label: "Adding WWN {{ hba_wwn_task8 }} to host group {{ host_grp_number_task8 }} on port {{ port_id_task8 }}"
      when: hba_wwn_task8 is defined
      register: results
      # loop:
      #   - { port_id: "CL5-G", host_grp_number: 1, hba_wwn: "100000109bd185d2" }
      #   - { port_id: "CL8-F", host_grp_number: 1, hba_wwn: "100000109bd185a8" }

    - name: Display the created host group WWN
      debug:
        msg: "{{results}}"

    - name: Debug storage_serial
      ansible.builtin.debug:
        var: storage_serial

    # TASK 9: Create snapshot
    - name: Create snapshot
      snapshot:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: "{{ state_snapshot}}"
        pvol: "{{ ldevid_task9 }}"
        pool_id: "{{ poolid_task9}}"
        snapshot_group_name: "{{ snapshot_name_task9 }}"
        # Optional
        mu_numbers: "{{ item }}" # required when snap_mode is cascade
        svol: "{{ svol_task9 }}" # required when snap_mode is cascade
        snap_mode: "{{ snap_mode_task9 }}" # "normal" or "cascade" ; default is "normal"
      # loop: "{{ mu_task6.split(',') | map('int') }}"
      loop: "{{ mu_task6 | string | split(',') | map('int') }}"
      loop_control:
        label: "Creating snapshot for LDEV ID {{ ldevid_task9 }} with snapshot group name {{ snapshot_name_task9 }} and MU numbers {{ item }}"
      when: ldevid_task9 is defined
      register: results
      # loop:
      #   - { ldevId: 3104, name: "mgmtvol_snapshot_1", mu: 3 }

      #   - { ldevId: 2816, name: "exportvol_snapshot-b00", mu: 3 }
      #   - { ldevId: 2816, name: "exportvol_snapshot-b00", mu: 4 }

      #   - { ldevId: 2822, name: "exportvol_snapshot-b06", mu: 3 }
      #   - { ldevId: 2822, name: "exportvol_snapshot-b06", mu: 4 }

      #   - { ldevId: 2823, name: "exportvol_snapshot-b07", mu: 3 }
      #   - { ldevId: 2823, name: "exportvol_snapshot-b07", mu: 4 }

    - name: Display the created snapshot
      debug:
        msg: "{{results}}"
