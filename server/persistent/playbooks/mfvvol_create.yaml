- name: demo - mfvvol_create
  hosts: localhost
  gather_facts: false
  become: true
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:
    - name: Create MF VVOLs
      mfvvol:
        #connectivity
        horcm_inst: "{{ horcm_inst }}" # Variable added
        storage_serial: "{{ storage_serial }}" # Variable added
        #properties
        state: present
        pool_name: "{{ pool_name }}" # Variable added
        num_ldevs: "{{ num_ldevs }}" # Variable added
        ldev_prefix: "{{ ldev_prefix }}" # Variable added
        initial_hex: "{{ initial_hex }}" # Variable added
        base_ldev_name: "{{ base_ldev_name }}" # Variable added
        name_start: "{{ name_start }}" # Variable added
        cylinder: "{{ cylinder }}" # Variable added
        emulation: "{{ emulation }}" # Variable added
      register: results

    - name: Display the created MF VVOLs
      debug:
        msg: "{{results}}"
