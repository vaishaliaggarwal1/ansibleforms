- name: Galahad
  hosts: localhost
  vars:
    # Connection values
    storage_serial: "{{ storage_serial }}"
    horcm_inst: "{{ horcm_instance }}"

    # constants
    format_ldev: "{{ format_ldev | default(true) | bool }}"
    # ansible_python_interpreter: "/usr/bin/python3"
    # pvol_file: "openpvol_create.facts"

  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:
    - name: Creating Open PVOLs with the addmultipleopenpvols function
      openpvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: present
        parity_grp_id: "{{ item.parity_grp_id }}"
        capacity: "{{ item.capacity }}"
        start_ldev: "{{ item.start_ldev }}"
        end_ldev: "{{ item.end_ldev }}"
        emulation: "{{ item.emulation }}"
        # base_name: "{{ item.base_name }}"
        # name_start: "{{ item.name_start }}"
        mp_blade_id: "{{ item.mp_blade_id }}"
        format_ldevs: "{{ format_ldevs }}"
      loop:
        - {
            start_ldev: 261,
            end_ldev: 263,
            capacity: "20",
            parity_grp_id: "1-1",
            emulation: "OPEN-V",
            mp_blade_id: "0",
          }
        # - { start_ldev: 520, end_ldev: 527, capacity: "5280628736", parity_grp_id: "1-5", emulation: "OPEN-V", mp_blade_id: "0" }
      register: create

    - name: Debug output
      debug:
        var: create

    - name: Show created LDEVs
      debug:
        msg: "Created LDEV: {{ item.ldev_id }} (Name: {{ item.name }}, Status: {{ item.status }})"
      loop: "{{ create.pvol_facts | default([]) }}"
      when: create.pvol_facts is defined and create.pvol_facts | length > 0

    - name: Display format status summary
      debug:
        msg: |
          Format status summary:
          - Normal volumes: {{ create.format_status.normal_volumes }}
          - Blocked volumes: {{ create.format_status.blocked_volumes }}
          - Total volumes: {{ create.format_status.total_volumes }}
          {% if create.format_status.note is defined %}
          - {{ create.format_status.note }}
          {% endif %}
      when: create.format_status is defined

    - name: Display warning for LDEVs in BLK status
      debug:
        msg: |
          WARNING: Some LDEVs are in BLK (blocked) status due to ongoing formatting.
          BLK status indicates that the quick format is still in progress.
          Use the following command to check the status:
          raidcom get ldev -ldev_id {{ item.ldev_id }} -I{{ horcm_inst }} -s {{ storage_serial }}
      loop: "{{ create.pvol_facts | default([]) }}"
      when: create.pvol_facts is defined and item.status is defined and item.status == 'BLK'

    - name: Provide information on formatting
      debug:
        msg: |
          NOTE: The module now includes a polling mechanism that waits for formatting to complete.
          If volumes still show as BLK status, the formatting may take longer than the allocated polling time.
          Quick format operations run asynchronously on the storage array and will continue in the background.
          Volumes will automatically transition to NML status when formatting completes.
      when:
        # format_ldevs|bool and create.format_status.blocked_volumes|int > 0
        - format_ldevs | default(false) | bool
        - create.format_status is defined
        - create.format_status.blocked_volumes | default(0) | int > 0

    - name: Save created Open PVOL information
      copy:
        content: "{{ create | to_nice_json }}"
        dest: "{{ pvol_file }}"
      when: create is defined and create.changed

    - name: Create Galahad pool
      pool:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: add
        pool_id: 3
        pool_name: "Galahad"
        ldev_id: [512, 513, 514]
        #Optional
        cnt: "40"
        # grp_opt: ""
        # device_grp_name: ""
        user_threshold: "80 90"
      register: results

    - name: Display the created Mainframe Pools
      debug:
        msg: results

    - name: Creating Open VVOLs with the addmultipleopenvvols function
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: present
        pool_id: 3
        capacity: "{{ item.size }}"
        start_ldev: "{{ item.start_ldev }}"
        end_ldev: "{{ item.end_ldev }}"
        emulation: "{{ item.emulation }}"
        # base_name: "{{ base_name }}"
        # name_start: "{{ name_start }}"
      loop:
        - {
            start_ldev: 2816,
            end_ldev: 2825,
            name: "ExportVolume",
            size: "4294967296",
            emulation: "OPEN-V",
          }
        - {
            start_ldev: 3072,
            end_ldev: 3081,
            name: "VerifyBase",
            size: "4294967296",
            emulation: "OPEN-V",
          }
        - {
            start_ldev: 3088,
            end_ldev: 3097,
            name: "VerifyAccess",
            size: "4294967296",
            emulation: "OPEN-V",
          }
      register: openvvol

    - name: Display created VVOLs
      debug:
        msg: openvvol

    # Create single Open VVOL using addldevnew function
    - name: Create MgmtTableVolume VVOL
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: single
        ldev_id: 3104
        poolid: 3
        capacity: "1g" # value could be in blks (1GB = 2097152 blocks) or "1g"
      register: single_vvol

    - name: Debug output for single Open VVOL
      debug:
        var: single_vvol

    # Modify Open VVOL using modifyldevname function
    - name: Modify MgmtTableVolume VVOL name
      openvvol:
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        state: modify
        ldev_id: 3104
        ldev_name: "MgmtTableVolume"
      register: modified_vvol

    - name: Debug output for modified Open VVOL
      debug:
        var: modified_vvol

    - name: Create host group
      hostgroup:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: present
        port_id: "{{ item.portId }}"
        host_grp_number: "{{ item.hostGroupNumber }}"
        host_grp_name: "{{ item.hostGroupName }}"
        host_mode: "WIN_EX"
      loop:
        - {
            portId: "CL5-G",
            hostGroupNumber: 1,
            hostGroupName: "MngmtTableVols",
          }
        - {
            portId: "CL8-F",
            hostGroupNumber: 1,
            hostGroupName: "MngmtTableVols",
          }
        - { portId: "CL1-G", hostGroupNumber: 1, hostGroupName: "dummy" }
      register: results

    - name: Display the created host group
      debug:
        msg: "{{results}}"

    - name: Add LUN to host group
      hostgroup_lun:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: present
        port_id: "{{ item.port_id }}"
        host_grp_number: "{{ item.host_grp_number }}"
        ldev_id: "{{ item.ldev_id }}"
        lun: "{{ item.lun_id }}"
      loop:
        - { port_id: "CL5-G", host_grp_number: 1, ldev_id: "3104", lun_id: "0" }
        - { port_id: "CL8-F", host_grp_number: 1, ldev_id: "3104", lun_id: "0" }
        - { port_id: "CL4-F", host_grp_number: 3, ldev_id: "2816", lun_id: "0" }
        - { port_id: "CL4-F", host_grp_number: 3, ldev_id: "2817", lun_id: "1" }
        - { port_id: "CL4-F", host_grp_number: 3, ldev_id: "2818", lun_id: "2" }

        - { port_id: "CL1-G", host_grp_number: 3, ldev_id: "2816", lun_id: "0" }
        - { port_id: "CL1-G", host_grp_number: 3, ldev_id: "2817", lun_id: "1" }

        - { port_id: "CL4-F", host_grp_number: 4, ldev_id: "3088", lun_id: "0" }
        - { port_id: "CL4-F", host_grp_number: 4, ldev_id: "3089", lun_id: "1" }

        - { port_id: "CL1-G", host_grp_number: 4, ldev_id: "3088", lun_id: "0" }
        - { port_id: "CL1-G", host_grp_number: 4, ldev_id: "3089", lun_id: "1" }

        - { port_id: "CL1-G", host_grp_number: 1, ldev_id: "3072", lun_id: "0" }
        - { port_id: "CL1-G", host_grp_number: 1, ldev_id: "3073", lun_id: "1" }

      register: results

    - name: Display the created host group LUN
      debug:
        msg: "{{results}}"

    - name: Add WWN to host group
      hostgroup_wwn:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: present
        port_id: "{{ item.port_id}}"
        host_grp_number: "{{ item.host_grp_number }}"
        hba_wwn: "{{ item.hba_wwn }}"
      loop:
        - { port_id: "CL5-G", host_grp_number: 1, hba_wwn: "100000109bd185d2" }
        - { port_id: "CL8-F", host_grp_number: 1, hba_wwn: "100000109bd185a8" }
      register: results

    - name: Display the created host group WWN
      debug:
        msg: "{{results}}"

    - name: Create snapshot
      snapshot:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: present
        pvol: "{{ item.ldevId }}"
        # svol: "-1"
        pool_id: "3"
        snapshot_group_name: "{{ item.name }}"
        # Optional
        mu_numbers: "{{ item.mu }}"
        # canCascade: true
      loop:
        - { ldevId: 3104, name: "mgmtvol_snapshot_1", mu: 3 }

        - { ldevId: 2816, name: "exportvol_snapshot-b00", mu: 3 }
        - { ldevId: 2816, name: "exportvol_snapshot-b00", mu: 4 }

        - { ldevId: 2822, name: "exportvol_snapshot-b06", mu: 3 }
        - { ldevId: 2822, name: "exportvol_snapshot-b06", mu: 4 }

        - { ldevId: 2823, name: "exportvol_snapshot-b07", mu: 3 }
        - { ldevId: 2823, name: "exportvol_snapshot-b07", mu: 4 }
      register: results

    - name: Display the created snapshot
      debug:
        msg: "{{results}}"
