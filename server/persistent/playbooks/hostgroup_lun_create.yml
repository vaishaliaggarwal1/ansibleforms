# Description:
# Add LUN to the host group
#
# Usage:
# ansible-playbook hostgroup_lun_create.yml
#
- name: demo - hostgroup_lun_create
  hosts: localhost
  gather_facts: false
  become: true
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:
    - name: Add LUN to host group
      hostgroup_lun:
        #connectivity
        horcm_inst: "{{ horcm_inst }}"
        storage_serial: "{{ storage_serial }}"
        #properties
        state: present
        port_id: "{{ port_id }}"
        host_grp_number: "{{ host_grp_number }}"
        ldev_id: "{{ ldev_id }}"
      register: results

    - name: Display the created host group LUN
      debug:
        msg: "{{results}}"
