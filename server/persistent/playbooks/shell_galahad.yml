---
####################################################################
# GALAHAD  Playbook
####################################################################
- name: GALAHAD Storage playbook (Shell)
  hosts: localhost
  gather_facts: false

  vars:
    max_retries: 10     # loop variablle for maximum retries to check PVOL status
    delay_seconds: 3    # delay between retries
    all_nml: false      # Variable to track if all LDEVs are NML
    ldev_sts_list: []   # List to store LDEV statuses

    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ storage_username }}"
      password: "{{ storage_secret }}"

  tasks:
    - name: Reset command status
      shell: raidcom reset command_status
      environment:
        HORCMINST: "{{ instance }}"
      changed_when: false

    - name: Prepare LDEV data for looping
      ansible.builtin.set_fact:
        pvol_prepared: >
          {%- set new_list = [] -%}
          {%- for row in pvol -%}
          {%- set ldevs = row.ldev_task1.split(',') -%}
          {%- for ldev in ldevs -%}
          {%- set _ = new_list.append({
              'parity_task1': row.parity_task1,
              'ldev_task1': ldev,
              'capacity_task1': row.capacity_task1,
              'emulation_task1': row.emulation_task1,
              'mp_blade_id_task1': row.mp_blade_id_task1
            }) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ new_list }}
      when: pvol is defined and pvol | length > 0

    - name: Add LDEV (PVOL)
      ansible.builtin.shell: "raidcom add ldev -parity_grp_id {{ item.parity_task1 }} -ldev_id {{ item.ldev_task1 }} -emulation {{ item.emulation_task1 }} -capacity {{ item.capacity_task1 }} -mp_blade_id {{ item.mp_blade_id_task1 }} -I{{ instance }} -s {{ storage_serial }}"
      loop: "{{ pvol_prepared }}"
      loop_control:
        label: "Creating LDEV {{ item.ldev_task1 }} on parity {{ item.parity_task1 }}"
      when: create_pvol is defined and create_pvol
      register: ldev
    # - name: Display the LDEV
    #   debug:
    #     var: ldev
    # - name: Log error in a file and print a brief message
    #   ansible.builtin.include_tasks: parse_ldev_results.yml

    - name: Wait for 1 seconds
      pause:
        seconds: 1

    - name: Initialize LDEV
      shell: raidcom initialize ldev -ldev_id {{ item.ldev_task1 }} -operation qfmt -I{{ instance }} -s {{ storage_serial }}
      register: initialize_ldev_result
      loop: "{{ pvol_prepared }}"
      loop_control:
        label: "Creating LDEV {{ item.ldev_task1 }} on parity {{ item.parity_task1 }}"
      when: create_pvol is defined and create_pvol

    - name: Wait for 2 seconds
      pause:
        seconds: 2

    # This task will perform the check on LDEV Satus and loop until the LDEV Status are 'NML' (Normal).
    - name: Wait for LDEVs to reach NML status with retries
      shell: |
        #!/bin/bash
        # Ensure Ansible facts are available.
        # This script will run the raidcom command, parse its output,
        # and echo a simple result back for Ansible's 'until' to evaluate.

        # Initialize all_nml_status to a known state (false) for this iteration
        ALL_NML_STATUS="false"
        LDEV_STS_LIST=""

        # Get LDEV IDs from Ansible var (assuming it's a comma-separated string)
        LDEV_IDS="{{ pvol_prepared | map(attribute='ldev_task1') | list | join(',') }}"

        # Loop through each LDEV ID and check its status
        ALL_LDEVS_NML=true
        TEMP_LDEV_STS=()

        IFS=',' read -ra ADDR <<< "$LDEV_IDS"
        for ldev_id in "${ADDR[@]}"; do
          # Execute raidcom and extract STS
          RAIDCOM_OUTPUT=$(raidcom get ldev -ldev_id "${ldev_id}" -I{{ instance }} -s {{ storage_serial }} 2>&1)
          CURRENT_STS=$(echo "$RAIDCOM_OUTPUT" | grep -oP 'STS\s*:\s*\K\w+')

          TEMP_LDEV_STS+=("$CURRENT_STS")

          if [[ "$CURRENT_STS" != "NML" ]]; then
            ALL_LDEVS_NML=false
            break # No need to check further if one is not NML
          fi
        done

        # Set the all_nml_status for Ansible's until condition
        if [[ "$ALL_LDEVS_NML" = true ]]; then
          ALL_NML_STATUS="true"
        fi

        # Output the status and the list for Ansible to capture and set facts
        echo "ANSIBLE_ALL_NML_STATUS:$ALL_NML_STATUS"
        echo "ANSIBLE_LDEV_STS_LIST:$(IFS=','; echo "${TEMP_LDEV_STS[*]}")"

        # Exit with 0 to indicate the script itself ran successfully,
        # the 'until' condition will decide the task's loop.
        exit 0
      # args:
      # No 'creates' argument. If the file exists, it will skip the task,
      # which means the polling loop won't run. This is for idempotent creation.
      # For polling, you almost never want 'creates'.
      # creates: /tmp/ansible_ldev_status_check.lock
      register: ldev_poll_result
      until: "ldev_poll_result.stdout.find('ANSIBLE_ALL_NML_STATUS:true') != -1"
      retries: "{{ max_retries | int + 1 }}" # Total attempts including the first
      delay: "{{ delay_seconds | int }}" # Delay between attempts
      changed_when: false # This task only polls, doesn't change state
      failed_when: false # Don't fail the task itself if not NML yet, let 'until' handle it.

    # After the loop, explicitly set facts based on the final result
    - name: Set final all_nml and ldev_sts_list facts
      set_fact:
        all_nml: "{{ 'true' in ldev_poll_result.stdout | default('') }}"
        ldev_sts_list: >-
          {% set matched_list = ldev_poll_result.stdout | default('') | regex_search('ANSIBLE_LDEV_STS_LIST:(.*)', '\\1') %}
          {% if matched_list %}
            {{ matched_list[0].split(',') | list }}
          {% else %}
            [] # Provide an empty list if no match is found
          {% endif %}
      delegate_to: localhost
      delegate_facts: true # Ensure these are applied to localhost for subsequent tasks

    - name: Final verification after LDEV status loop
      debug:
        msg: "All LDEVs are NML. Proceeding with subsequent tasks."
      when: hostvars['localhost']['all_nml'] | default(False)

    - name: Fail the playbook if LDEVs did not reach NML state after all retries
      fail:
        msg: "LDEVs failed to reach NML state after {{ max_retries }} retries. Final STS list: {{ hostvars['localhost']['ldev_sts_list'] | default('N/A') }}"
      when: not hostvars['localhost']['all_nml'] | default(False)

    # --- Start of other tasks (these will only run if the LDEV are NML) ---
    # Task 2 - Add DP Pool
    - name: Add DP Pool
      shell: raidcom add dp_pool -pool_name {{ item.pool_name_task2}} -ldev_id {{ item.ldev_task2 }} -user_threshold {{ item.threshold_1 }} {{item.threshold_2}} -I{{ instance }} -s {{ storage_serial }}
      register: dp_pool_result
      loop: "{{pool}}"
      when: pool is defined and all_nml
    - name: Display the DP Pool
      debug:
        var: dp_pool_result

    - name: Wait for 15 seconds
      pause:
        seconds: 15

    - name: Prepare VVOL data for looping
      ansible.builtin.set_fact:
        vvol_prepared: >
          {%- set new_list = [] -%}
          {%- for row in vvol -%}
          {%- set ldevs = row.ldev_id_task3.split(',') -%}
          {%- for ldev in ldevs -%}
          {%- set _ = new_list.append({
                'pool_name_task3': row.pool_name_task3,
                'ldev_id_task3': ldev,
                'ldev_size_task3': row.ldev_size_task3,
                'emulation_type_task3': row.emulation_type_task3,
                'mp_blade_task3': row.mp_blade_task3
              }) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ new_list }}
      when: vvol is defined

    # Task 3 - Add LDEV (VVOL)
    - name: Add LDEV (VVOL - using ldev id)
      shell: raidcom add ldev -pool {{ item.pool_name_task3 }} -ldev_id {{ item.ldev_id_task3 }} -capacity {{ item.ldev_size_task3 }} -emulation {{ item.emulation_type_task3 }} -mp_blade_id {{ item.mp_blade_task3 }} -I{{ instance }} -s {{ storage_serial }}
      register: vvol_ldev
      loop: "{{ vvol_prepared }}"
      loop_control:
        label: "Adding LDEV {{ item.ldev_id_task3 }} in Pool {{ item.pool_name_task3 }}"
      when: vvol is defined

    - name: Prepare Hostgroup data for looping
      ansible.builtin.set_fact:
        hostgroup_prepared: >
          {%- set new_list = [] -%}
          {%- for row in hostgroup -%}
          {%- set ldevs = row.ldev_id_task4.split(',') -%}
          {%- for ldev in ldevs -%}
          {%- set _ = new_list.append({
                'host_grp_name_task4': row.host_grp_name_task4,
                'port_task4': row.port_task4,
                'ldev_id_task4': ldev
              }) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ new_list }}

    # Add Hostgroup
    - name: Create Hostgroup
      shell: raidcom add host_grp -host_grp_name {{item.host_grp_name_task4}} -port {{item.port_task4}} -I{{instance}} -s {{storage_serial}}
      register: host_group
      loop: "{{hostgroup}}"
      when: hostgroup is defined
    - name: Display the Hostgroup
      debug:
        var: host_group
    - name: Modify host group
      shell: raidcom modify host_grp -port {{item.port_task4}} {{item.host_grp_name_task4}} -host_mode {{item.host_mode_task4}} -I{{instance}} -s {{storage_serial}}
      register: modify_host_group
      loop: "{{hostgroup}}"
      when: hostgroup is defined
    - name: Display the modified Hostgroup
      debug:
        var: modify_host_group
    - name: Add LUN
      shell: raidcom add lun -port {{item.port_task4}} {{item.host_grp_name_task4}} -ldev_id {{item.ldev_id_task4}} -I{{instance}} -s {{storage_serial}}
      loop: "{{hostgroup_prepared}}"
      loop_control:
        label: "Adding LDEV {{item.ldev_id_task4}}"
      register: lun_result
      when: hostgroup is defined
    - name: Display the LUN result
      debug:
        var: lun_result
    - name: Add WWN
      shell: raidcom add hba_wwn -port {{item.port_task4}} {{item.host_grp_name_task4}} -hba_wwn {{item.hba_wwn_task4}} -I{{instance}} -s {{storage_serial}}
      register: wwn_result
      loop: "{{hostgroup}}"
      when: hostgroup is defined
    - name: Display the WWN result
      debug:
        var: wwn_result

    # Task 5 : Create snapshot pair
    - name: Prepare snapshot data for looping
      ansible.builtin.set_fact:
        snapshot_prepared: >
          {%- set new_list = [] -%}
          {%- for row in snapshot -%}
          {%- set mirror_id = row.mirror_id_task5.split(',') -%}
          {%- for mid in mirror_id -%}
          {%- set _ = new_list.append({
                'pvol_task5': row.pvol_task5,
                'pool_task5': row.pool_task5,
                'snapshotgroup_task5': row.snapshotgroup_task5,
                'mirror_id_task5': mid,
                'snap_mode_task5': row.snap_mode_task5
              }) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ new_list }}
      when: snapshot is defined
      
    - name: Create snapshot pair
      shell: raidcom add snapshot -ldev_id {{item.pvol_task5}} -pool {{item.pool_task5}} -snapshotgroup {{item.snapshotgroup_task5}} -mirror_id {{item.mirror_id_task5}} -snap_mode {{item.snap_mode_task5}} -I{{ instance }} -s {{ storage_serial }}
      register: snapshot_pair
      loop: "{{ snapshot_prepared }}"
      loop_control:
        label: "Creating snapshot pair for LDEV {{ item.pvol_task5 }} in Snapshot Group {{ item.snapshotgroup_task5 }} with MU number {{ item.mirror_id_task5 }}"
      when: snapshot_prepared is defined
    - name: Display the snapshot pair result
      debug:
        var: snapshot_pair
