# Description:
# Create VVOLs on Hitachi Vantara Mainframe storage system using Ansible.
#
# Usage:
# ansible-playbook mf_vvol_create.yml
#
- name: demo - mfvvol_create
  hosts: localhost
  gather_facts: false
  become: true
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:
    - name: Create MF VVOLs
      vvol:
        #connectivity
        horcm_inst: "{{horcm_inst}}"
        storage_serial: "{{storage_serial}}"
        #properties
        state: present
        pool_name: "{{pool_name}}"
        num_ldevs: "{{num_ldevs}}"
        ldev_prefix: "{{ldev_prefix}}"
        initial_hex: "{{initial_hex}}"
        base_ldev_name: "{{base_ldev_name}}"
        name_start: "{{name_start}}"
        cylinder: "{{cylinder}}"
        emulation: "{{emulation}}"
      register: results

    - name: Display the created MF VVOLs
      debug:
        msg: "{{results}}"
