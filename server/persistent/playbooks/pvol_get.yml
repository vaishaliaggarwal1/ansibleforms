#
# Abstract: Get PVOL List
#
# Description:
# Get the list of all PVOLs in specified Parity Group from the Hitachi Vantara Storage System.
#
# Usage:
# ansible-playbook galahad.yml
#
- name: demo - pvol_get
  hosts: localhost
  gather_facts: false
  become: true
  collections:
    - hitachivantara.mfstorage_raidcom

  vars:
    parity_grp_id: "{{parity_grp_id}}"

  tasks:
    - name: demo - pvol get
      ldevget:
        #connectivity
        horcm_inst: "{{horcm_inst}}"
        storage_serial: "{{storage_serial}}"
        #properties
        state: getall
        ldevtype: "parity_grp -parity_grp_id {{ parity_grp_id }}"

      register: results

    - name: Display the PVOL List for Pool ID
      debug:
        msg: "{{results}}"
