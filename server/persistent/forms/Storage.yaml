- name: HiRAID - Galahad
  showHelp: true
  help: |
    Create open Galahad components using HiRAID commands.
  roles:
    - admin
  description: Create open Galahad components using HiRAID commands
  categories:
    - Storage
  icon: hdd
  playbook: hiraid_galahad.yml
  tileClass: has-background-warning-light
  type: ansible
  fields:
    - name: storage_serial
      label: Storage Serial
      type: enum
      values:
        - "530689"
        - "530531"
        - "530642"
      required: true
    - name: horcm_inst
      label: HORCM Instance
      type: number
      required: true
      placeholder: "1"
    - name: add_pvol
      label: Create PVOL's ?
      type: checkbox
      switch: true
    - name: state_pvol
      label: PVOL State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: paritygrp_id_task1
      label: Parity Group ID
      type: enum
      values:
        - 1-1
        - 1-4
        - 1-5
        - 1-6
        - 1-7
        - 1-8
      required: true
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: start_ldev_task1
      label: Start LDEV
      type: number
      required: true
      placeholder: "512"
      line: ldevid
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: end_ldev_task1
      label: End LDEV
      type: number
      required: true
      placeholder: "519"
      line: ldevid
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: capacity_task1
      label: Capacity (blocks)
      type: text
      required: true
      placeholder: "5280628736"
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: emulation_task1
      label: Emulation
      type: enum
      values:
        - OPEN-V
      required: true
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: mp_blade_id_task1
      label: MP Blade ID
      type: number
      required: false
      line: pvol
      width: is-two-thirds
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: format_ldevs_task1
      label: Format LDEVs after creation?
      type: checkbox
      line: pvol
      switch: true
      dependencies:
        - name: add_pvol
          values:
            - true
    - name: create_pool
      label: Create Galahad Pool?
      type: checkbox
      switch: true
    - name: state_pool
      label: State
      type: enum
      values:
        - add
      default: add
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: pool_id_task2
      label: Pool ID
      type: number
      required: true
      line: pool
      dependencies:
        - name: create_pool
          values:
            - true
    - name: pool_name_task2
      label: Pool Name
      type: text
      line: pool
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: ldev_id_task2
      label: Enter list of LDEV IDs (comma-separated)
      type: text
      placeholder: 512,513,514,515
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: count_task2
      label: Pool Count
      type: text
      required: false
      dependencies:
        - name: create_pool
          values:
            - true
    - name: warning_threshold_rate
      label: Pool Warning Threshold
      type: text
      required: false
      line: threshold
      default: 80
      placeholder: "80"
      dependencies:
        - name: create_pool
          values:
            - true
    - name: depletion_threshold_rate
      label: Pool Depletion Threshold
      type: text
      required: false
      line: threshold
      default: 90
      placeholder: "90"
      dependencies:
        - name: create_pool
          values:
            - true
    - name: create_vvols
      label: Create multiple VVOLs?
      type: checkbox
      switch: true
    - name: state_vvol
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: pool_id_task3
      label: VVOL Pool ID
      type: number
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: start_ldev_task3
      label: VVOL Start LDEV
      type: number
      line: ldev
      required: true
      placeholder: "61473"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: end_ldev_task3
      label: VVOL End LDEV
      type: number
      line: ldev
      required: true
      placeholder: "61478"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: size_task3
      label: VVOL Size
      type: text
      required: true
      placeholder: "2097152"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: emulation_task3
      label: VVOL Emulation
      type: enum
      values:
        - OPEN-V
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: create_single_vvol
      label: Create Single VVOL?
      type: checkbox
      switch: true
    - name: state_single
      label: State
      type: enum
      values:
        - single
      default: single
      required: true
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: ldev_id_task4
      label: LDEV ID
      type: number
      required: true
      placeholder: "61479"
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: pool_id_task4
      label: Pool ID
      type: number
      required: true
      placeholder: "3"
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: capacity_task4
      label: Volume Capacity
      type: text
      required: true
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: modify_vvol
      label: Modify VVOL Name ?
      type: checkbox
      switch: true
