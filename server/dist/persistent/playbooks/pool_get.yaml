- name: demo - mf pool get
  hosts: localhost
  gather_facts: no
  become: yes
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:

  - name: Get MF Pools
    poolget:
      #connectivity
      horcm_inst: "{{ horcm_inst }}"         # Variable added
      storage_serial: "{{ storage_serial }}" # Variable added
      #properties
      state: present
    register: results

  - name: Display the existing MF Pools
    debug:
      msg: "{{results}}" 