- name: demo - vvol_get
  hosts: localhost
  gather_facts: no
  become: yes
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:

  - name: vvol get
    vvolget:
      #connectivity
      horcm_inst: 0
      storage_serial: 530689
      #properties
      state: get
      ldevtype: "dp_volume"
      pool_id: "5"
    register: results

  - name: Display the VVOL List for Pool ID 
    debug:
      msg: "{{results}}"
