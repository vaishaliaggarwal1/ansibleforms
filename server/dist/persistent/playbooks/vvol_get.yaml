- name: demo - vvol_get
  hosts: localhost
  gather_facts: no
  become: yes
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:

  - name: vvol get # Restored original task
    vvolget:
      #connectivity
      horcm_inst: "{{ horcm_inst }}"         # Variable added
      storage_serial: "{{ storage_serial }}" # Variable added
      #properties
      state: get
      ldevtype: "{{ ldevtype }}"             # Variable added
      pool_id: "{{ pool_id }}"               # Variable added
    register: results

  - name: Display the VVOL List for Pool ID # Restored original task
    debug:
      msg: "{{results}}"

