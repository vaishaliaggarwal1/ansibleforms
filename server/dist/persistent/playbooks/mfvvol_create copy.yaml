- name: demo - mfvvol_create
  hosts: localhost
  gather_facts: no
  become: yes
  collections:
    - hitachivantara.mfstorage_raidcom

  tasks:

  - name: Create MF VVOLs
    mfvvol:
      #connectivity
      horcm_inst: 0
      storage_serial: 530689
      #properties
      state: present
      pool_name: "5"
      num_ldevs: 1
      ldev_prefix: "00:10:"
      initial_hex: "0F"
      base_ldev_name: "VK_Test_LDEV_"
      name_start: 15
      cylinder: 10
      emulation: "3390-A"
    register: results

  - name: Display the created MF VVOLs
    debug:
      msg: "{{results}}" 