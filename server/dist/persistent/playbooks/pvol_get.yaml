- name: demo - pvol_get
  hosts: localhost
  gather_facts: no
  become: yes
  collections:
    - hitachivantara.mfstorage_raidcom

  vars:
    parity_grp_id: "{{ parity_grp_id }}"

  tasks:

  - name: Get physical volumes
    vvolget:
      #connectivity
      horcm_inst: "{{ horcm_inst }}"
      storage_serial: "{{ storage_serial }}"
      #properties
      state: get
      ldevtype: "parity_grp"
      parity_grp_id: "{{ parity_grp_id }}"
      
    register: results

  - name: Display the PVOL List for Parity Group
    debug:
      msg: "{{results}}"
