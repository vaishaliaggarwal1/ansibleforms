- name: HiRAID - Test
  showHelp: true
  help: |
    Create open Galahad components using HiRAID commands.
  roles:
    - admin
  description: Create open Galahad components using HiRAID commands
  categories:
    - Storage
  icon: hdd
  playbook: hiraid_test.yml
  tileClass: has-background-warning-light
  type: ansible
  fields:
    - name: storage_serial
      label: Storage Serial
      type: enum
      values:
        - "530689"
        - "530531"
        - "530642"
      required: true
    - name: horcm_inst
      label: HORCM Instance
      type: number
      required: true
      placeholder: "1"
    - name: add_pvol
      label: Create PVOL's ?
      type: checkbox
      switch: true
    - name: pvol_table
      type: table
      dependencies:
        - name: add_pvol
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: state_pvol
          label: PVOL State
          type: enum
          values:
            - present
          default: present
          required: true
        - name: paritygrp_id_task1
          label: Parity Group ID
          type: enum
          values:
            - 1-1
            - 1-4
            - 1-5
            - 1-6
            - 1-7
            - 1-8
          required: true
        - name: start_ldev_task1
          label: Start LDEV
          type: number
          required: true
          placeholder: "512"
        - name: end_ldev_task1
          label: End LDEV
          type: number
          required: true
          placeholder: "519"
        - name: capacity_task1
          label: Capacity (blocks)
          type: text
          required: true
          placeholder: "5280628736"
        - name: emulation_task1
          label: Emulation
          type: enum
          values:
            - OPEN-V
          required: true
        - name: mp_blade_id_task1
          label: MP Blade ID
          type: number
          required: false
        - name: format_ldevs_task1
          label: Format LDEVs after creation?
          type: checkbox
          switch: true
    - name: create_pool
      label: Create Galahad Pool?
      type: checkbox
      switch: true
    - name: state_pool
      label: State
      type: enum
      values:
        - add
      default: add
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: pool_id_task2
      label: Pool ID
      type: number
      required: true
      line: pool
      dependencies:
        - name: create_pool
          values:
            - true
    - name: pool_name_task2
      label: Pool Name
      type: text
      line: pool
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: ldev_id_task2
      label: Enter list of LDEV IDs (comma-separated)
      type: text
      placeholder: 512,513,514,515
      required: true
      dependencies:
        - name: create_pool
          values:
            - true
    - name: count_task2
      label: Pool Count
      type: text
      required: false
      dependencies:
        - name: create_pool
          values:
            - true
    - name: warning_threshold_rate
      label: Pool Warning Threshold
      type: text
      required: false
      line: threshold
      default: 80
      placeholder: "80"
      dependencies:
        - name: create_pool
          values:
            - true
    - name: depletion_threshold_rate
      label: Pool Depletion Threshold
      type: text
      required: false
      line: threshold
      default: 90
      placeholder: "90"
      dependencies:
        - name: create_pool
          values:
            - true
    - name: create_vvols
      label: Create multiple VVOLs?
      type: checkbox
      switch: true
    - name: state_vvol
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: pool_id_task3
      label: VVOL Pool ID
      type: number
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: start_ldev_task3
      label: VVOL Start LDEV
      type: number
      line: ldev
      required: true
      placeholder: "61473"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: end_ldev_task3
      label: VVOL End LDEV
      type: number
      line: ldev
      required: true
      placeholder: "61478"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: size_task3
      label: VVOL Size
      type: text
      required: true
      placeholder: "2097152"
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: emulation_task3
      label: VVOL Emulation
      type: enum
      values:
        - OPEN-V
      required: true
      dependencies:
        - name: create_vvols
          values:
            - true
    - name: vvol_table
      type: table
      dependencies:
        - name: create_vvols
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: pool_id_task3
          label: VVOL Pool ID
          type: number
          required: true
        - name: start_ldev_task3
          label: VVOL Start LDEV
          type: number
          required: true
          placeholder: "61473"
        - name: end_ldev_task3
          label: VVOL End LDEV
          type: number
          required: true
          placeholder: "61478"
        - name: size_task3
          label: VVOL Size
          type: text
          required: true
          placeholder: "2097152"
        - name: emulation_task3
          label: VVOL Emulation
          type: enum
          values:
            - OPEN-V
          required: true
    - name: create_single_vvol
      label: Create Single VVOL?
      type: checkbox
      switch: true
    - name: state_single
      label: State
      type: enum
      values:
        - single
      default: single
      required: true
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: ldev_id_task4
      label: LDEV ID
      type: number
      required: true
      placeholder: "61479"
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: pool_id_task4
      label: Pool ID
      type: number
      required: true
      placeholder: "3"
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: capacity_task4
      label: Volume Capacity
      type: text
      required: true
      dependencies:
        - name: create_single_vvol
          values:
            - true
    - name: modify_vvol
      label: Modify VVOL Name ?
      type: checkbox
      switch: true
    - name: state_modify
      label: State
      type: enum
      values:
        - modify
      default: modify
      required: true
      dependencies:
        - name: modify_vvol
          values:
            - true
    - name: ldev_id_task5
      label: LDEV ID
      type: text
      line: modify_ldev
      required: true
      dependencies:
        - name: modify_vvol
          values:
            - true
    - name: ldev_name_task5
      label: LDEV Name
      type: text
      required: true
      line: modify_ldev
      dependencies:
        - name: modify_vvol
          values:
            - true
    - name: modify_vvol_table
      type: table
      dependencies:
        - name: modify_vvol
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: ldev_id_task5
          label: LDEV ID
          type: text
          required: true
        - name: ldev_name_task5
          label: LDEV Name
          type: text
          required: true
    - name: create_hostgroups
      label: Create Host Groups ?
      type: checkbox
      switch: true
    - name: state_hostgroup
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_hostgroups
          values:
            - true
    - name: portid_task6
      label: Port ID
      type: enum
      values:
        - CL1-E
        - CL5-G
        - CL8-F
        - CL4-F
        - CL1-G
      required: true
      dependencies:
        - name: create_hostgroups
          values:
            - true
    - name: host_group_number_task6
      label: Host Group Number
      type: number
      required: true
      dependencies:
        - name: create_hostgroups
          values:
            - true
    - name: host_group_name_task6
      label: Host Group Name
      type: text
      required: true
      dependencies:
        - name: create_hostgroups
          values:
            - true
    - name: host_mode_task6
      label: Host Mode
      type: enum
      values:
        - AIX
        - LINUX
        - VMWARE
        - WIN
        - WIN_EX
      required: true
      dependencies:
        - name: create_hostgroups
          values:
            - true
    - name: hostgroup_table
      type: table
      dependencies:
        - name: create_hostgroups
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: portid_task6
          label: Port ID
          type: enum
          values:
            - CL1-E
            - CL5-G
            - CL8-F
            - CL4-F
            - CL1-G
          required: true
        - name: host_group_number_task6
          label: Host Group Number
          type: number
          required: true
        - name: host_group_name_task6
          label: Host Group Name
          type: text
          required: true
        - name: host_mode_task6
          label: Host Mode
          type: enum
          values:
            - AIX
            - LINUX
            - VMWARE
            - WIN
            - WIN_EX
          required: true
    - name: create_hostgroup_luns
      label: Add LUNs to Host Groups?
      type: checkbox
      switch: true
    - name: state_lun
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
    - name: port_id_task7
      label: LUN Port ID
      type: enum
      values:
        - CL1-E
        - CL5-G
        - CL8-F
        - CL4-F
        - CL1-G
      required: true
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
    - name: host_grp_number_task7
      label: LUN Host Group Number
      type: number
      required: true
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
    - name: ldev_id_task7
      help: >
        If LDEV ID and LUN are passed as "2816,2817,2818" and "0,1,2"
        respectively, then loop values will be "{ ldev_id: 2816, lun: 0 }", "{
        ldev_id: 2817, lun: 1 }" and "{ ldev_id: 2818, lun: 2 }"
      label: LUN LDEV ID
      type: text
      required: true
      placeholder: 2816,2817,2818
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
    - name: lun_id_task7
      label: LUN ID
      type: text
      required: true
      placeholder: 0,1,2
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
    - name: hostgroup_lun_table
      type: table
      dependencies:
        - name: create_hostgroup_luns
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: port_id_task7
          label: LUN Port ID
          type: enum
          values:
            - CL1-E
            - CL5-G
            - CL8-F
            - CL4-F
            - CL1-G
          required: true
        - name: host_grp_number_task7
          label: LUN Host Group Number
          type: number
          required: true
        - name: ldev_id_task7
          label: LUN LDEV ID
          type: text
          required: true
          placeholder: 2816,2817,2818
        - name: lun_id_task7
          label: LUN ID
          type: text
          required: true
          placeholder: 0,1,2
    - name: create_hostgroup_wwns
      label: Add WWNs to Host Groups?
      type: checkbox
      switch: true
    - name: state_wwn
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_hostgroup_wwns
