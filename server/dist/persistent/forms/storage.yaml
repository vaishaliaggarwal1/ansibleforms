        - CL5-G
        - CL8-F
        - CL4-F
        - CL1-G
      required: true
      dependencies:
        - name: create_hostgroup_wwns
          values:
            - true
    - name: host_grp_number_task8
      label: WWN Host Group Number
      type: number
      required: true
      dependencies:
        - name: create_hostgroup_wwns
          values:
            - true
    - name: hba_wwn_task8
      label: HBA WWN
      type: text
      required: true
      placeholder: 100000109bd185d2
      dependencies:
        - name: create_hostgroup_wwns
          values:
            - true
    - name: hostgroup_wwn_table
      type: table
      dependencies:
        - name: create_hostgroup_wwns
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: port_id_task8
          label: WWN Port ID
          type: enum
          values:
            - CL1-E
            - CL5-G
            - CL8-F
            - CL4-F
            - CL1-G
          required: true
        - name: host_grp_number_task8
          label: WWN Host Group Number
          type: number
          required: true
        - name: hba_wwn_task8
          label: HBA WWN
          type: text
          required: true
          placeholder: 100000109bd185d2
    - name: create_snapshots
      label: Create Snapshots?
      type: checkbox
      switch: true
    - name: state_snapshot
      label: State
      type: enum
      values:
        - present
      default: present
      required: true
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: poolid_task9
      label: Snapshot Pool ID
      type: number
      required: true
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: ldevid_task9
      label: Snapshot PVOL
      type: number
      required: true
      line: snapshot_ldev
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: svol_task9
      label: Snapshot SVOL
      type: text
      required: false
      line: snapshot_ldev
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: snapshot_name_task9
      label: Snapshot Name
      type: text
      required: true
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: mu_task6
      label: Mirror Unit
      type: number
      required: true
      placeholder: 3,4,5
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: snap_mode_task9
      label: Snapshot Mode
      type: text
      required: false
      default: normal
      dependencies:
        - name: create_snapshots
          values:
            - true
    - name: snapshot_table
      type: table
      dependencies:
        - name: create_snapshots
          values:
            - true
      allowInsert: true
      allowDelete: true
      tableFields:
        - name: ldevid_task9
          label: Snapshot PVOL
          type: number
          required: true
        - name: poolid_task9
          label: Snapshot Pool ID
          type: number
          required: true
        - name: snapshot_name_task9
          label: Snapshot Name
          type: text
          required: true
        - name: mu_start
          label: MU Start
          type: number
          required: true
          default: 3
        - name: mu_end
          label: MU End
          type: number
          required: true
          default: 30
        - name: snap_mode_task9
          label: Snapshot Mode (override)
          type: text
          required: false
        - name: svol_task9
          label: Snapshot SVOL (cascade)
          type: text
          required: false
  source: storage.yaml
- name: External Storage (shell)
  showHelp: true
  help: |
    Manage the External Storage
  roles:
    - admin
  description: This helps manage External Storage
  categories:
    - Storage
  type: ansible
  playbook: external_storage.yml
  tileClass: has-background-info-light
  icon: bullseye
  fields:
    - name: storage_serial
      label: Storage Serial
      type: enum
      values:
        - "530689"
        - "530531"
        - "530642"
      required: true
    - name: instance
      label: Raidcom Instance
      type: number
      required: true
    - type: text
      name: user
      label: Username
      required: true
    - type: password
      name: password
      label: Password
      required: true
      noLog: true
    - name: ldev_id
      type: number
      label: LDEV ID
      required: true
    - name: modify_ssid
      label: Modify SSID?
      type: checkbox
    - name: ssid
      type: text
      label: SSID
      required: true
      dependencies:
        - name: modify_ssid
          values:
            - true
    - name: add_external_group
      label: Add External Group ?
      type: checkbox
    - name: external_group
      type: text
      label: External Group ID
      required: true
      dependencies:
        - name: add_external_group
          values:
            - true
    - name: cylinder
      type: number
      label: Cylinder
      required: true
      dependencies:
        - name: add_external_group
          values:
            - true
    - name: emulation
      type: text
      label: Emulation
      required: true
      dependencies:
        - name: add_external_group
          values:
            - true
    - name: assign_ldevname
      label: Assign LDEV Name ?
      type: checkbox
    - name: ldev_name
      type: text
      label: LDEV Name
      required: true
      dependencies:
        - name: assign_ldevname
          values:
            - true
    - name: format
      label: Format ?
      type: checkbox
    - name: format_type
      type: enum
      values:
        - qfmt
        - fmt
      label: Format Type
      required: true
      dependencies:
        - name: format
          values:
            - true
  source: storage.yaml
