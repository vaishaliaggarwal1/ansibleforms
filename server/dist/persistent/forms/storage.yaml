- name: VSP Direct - Galahad
  showHelp: true
  help: |
    Retrieves a list of Virtual Volumes based on criteria using VSP Direct.
  roles:
    - admin
  description: Retrieves a list of Virtual Volumes based on criteria using VSP Direct
  categories:
    - Storage
  icon: hdd
  playbook: vsp_galahad.yml
  tileClass: has-background-info-light
  type: ansible
  fields:
    - name: storage_address
      label: Storage Address
      type: enum
      values:
        - 172.23.67.32
        - 172.23.67.33
        - 172.23.67.34
      required: true
    - name: instance
      label: Raidcom Instance
      type: number
      required: true
    - name: vault_storage_username
      label: Username
      type: text
      required: true
    - name: vault_storage_secret
      label: Password
      type: password
      required: true
      noLog: true
    - name: state
      label: State
      type: enum
      values:
        - present
        - split
      required: true
    - name: create_pvol
      label: Create LDEV (PVOL) ?
      type: checkbox
      switch: true
    - name: count_task1
      label: Number of LDEVs to be created
      type: number
      default: 1
      required: true
      dependencies:
        - name: create_pvol
          values:
            - true
    - name: ldevid_task1
      label: LDEV ID
      type: number
      required: true
      dependencies:
        - name: create_pvol
          values:
            - true
    - name: parity_task1
      label: Parity
      type: enum
      values:
        - 1-1
        - 1-4
        - 1-5
        - 1-6
        - 1-7
        - 1-8
      required: true
      dependencies:
        - name: create_pvol
          values:
            - true
    - name: capacity_task1
      label: Capacity (in GB)
      type: text
      required: true
      placeholder: 2518GB
      dependencies:
        - name: create_pvol
          values:
            - true
    - name: add_pool
      label: Add Pool alongwith PVOL ?
      type: checkbox
      switch: true
    - name: pool_name
      label: Pool Name
      type: text
      required: true
      dependencies:
        - name: add_pool
          values:
            - true
    - name: pool_type
      label: Pool type
      type: enum
      values:
        - HDP
      required: true
      dependencies:
        - name: add_pool
          values:
            - true
    - name: parity_grp
      label: Parity group
      type: enum
      values:
        - 1-1
        - 1-2
        - 1-4
        - 1-5
        - 1-6
        - 1-7
        - 1-8
      required: true
      dependencies:
        - name: add_pool
          values:
            - true
    - name: count
      label: Number of LDEVs to be created for selected Parity
      type: number
      required: false
      default: 1
      dependencies:
        - name: add_pool
          values:
            - true
    - name: pool_capacity
      label: Pool Capacity in GB
      type: text
      required: true
      placeholder: 2518GB
      dependencies:
        - name: add_pool
          values:
            - true
    - name: pool_warning_threshold_rate
      label: Pool Warning Threshold Rate
      type: number
      required: false
      default: 80
      dependencies:
        - name: add_pool
          values:
            - true
    - name: pool_depletion_threshold_rate
      label: Pool Depletion Threshold Rate
      type: number
      required: false
      default: 90
      dependencies:
        - name: add_pool
          values:
            - true
    - name: expand_pool
      label: Expand Pool ?
      type: checkbox
      switch: true
    - name: pool_id_task3
      type: number
      label: Pool ID
      required: true
      dependencies:
        - name: expand_pool
          values:
            - true
    - name: count_task3
      label: Number of LDEVs to be added in the Pool
      type: number
      default: 1
      required: true
      dependencies:
        - name: expand_pool
          values:
            - true
    - name: parity_grp_task3
      label: Parity Group
      type: enum
      values:
        - 1-1
        - 1-2
        - 1-4
        - 1-5
        - 1-6
        - 1-7
        - 1-8
      required: true
      dependencies:
        - name: expand_pool
          values:
            - true
    - name: capacity_task3
      label: Capacity
      type: text
      required: true
      placeholder: 10GB
      dependencies:
        - name: expand_pool
          values:
            - true
    - name: create_ldev
      label: Create LDEV (VVOL) ?
      type: checkbox
      switch: true
    - name: poolid_task4
      label: POOL ID
      type: number
      required: true
      dependencies:
        - name: create_ldev
          values:
            - true
    - name: count_task4
      label: Number of VVOLs to be created
      type: number
      default: 1
      required: true
      dependencies:
        - name: create_ldev
          values:
            - true
    - name: ldevid_task4
      label: LDEV ID
      type: number
      required: true
      dependencies:
        - name: create_ldev
          values:
            - true
    - name: ldev_name_task4
      label: LDEV Name
      type: text
      required: true
      dependencies:
        - name: create_ldev
          values:
            - true
    - name: ldev_size_task4
      label: LDEV Capacity
      type: text
      required: true
      placeholder: 2048GB
      dependencies:
        - name: create_ldev
          values:
            - true
    - name: create_hostgroup
      label: Create HostGroup ?
      type: checkbox
      switch: true
    - name: hostgroupname_task5
      label: HostGroup Name
      type: text
      required: true
      dependencies:
        - name: create_hostgroup
          values:
            - true
    - name: portId_task5
      label: Port Number
      type: enum
      values:
        - CL1-E
        - CL4-F
        - CL8-F
        - CL1-G
        - CL5-G
      required: true
      dependencies:
        - name: create_hostgroup
          values:
            - true
    - name: hostmode_task5
      label: Host Mode
      type: enum
      values:
        - WINDOWS_EXTENSION
        - LINUX
      required: true
      dependencies:
        - name: create_hostgroup
          values:
            - true
    - name: ldev_task5
      label: Enter list of LDEV IDs (comma-separated)
      type: text
      placeholder: 3104,2817,3091
      required: true
      dependencies:
        - name: create_hostgroup
          values:
            - true
    - name: hostWwn_task5
      label: Host WWN
      type: text
      required: false
      placeholder: 10000a123456a123
      dependencies:
        - name: create_hostgroup
          values:
            - true
    - name: create_snapshot
      label: Create Snapshot Pair?
      type: checkbox
      switch: true
    - name: ldevid_task6
      label: LDEV ID
      type: number
      required: true
      dependencies:
        - name: create_snapshot
          values:
            - true
    - name: poolid_task6
      label: POOL ID
      type: number
      required: true
      dependencies:
        - name: create_snapshot
          values:
            - true
    - name: snapname_task6
      label: Snapshot Name
      type: text
      required: true
      dependencies:
        - name: create_snapshot
          values:
            - true
    - name: mu_task6
      label: Mirro Unit Number
      type: text
      required: true
      dependencies:
        - name: create_snapshot
          values:
            - true
    - name: cascade
      label: Can Cascade?
      type: checkbox
      switch: true
      default: true
      dependencies:
        - name: create_snapshot
          values:
            - true
    - name: split_snapshot
      label: Split Snapshot ?
      type: checkbox
    - name: ldevid_task7
      label: Primary Volume ID (LDEV ID)
      type: number
      required: true
      dependencies:
        - name: split_snapshot
          values:
            - true
    - name: mu_task7
      label: Mirror unit ID
      type: number
      required: true
      dependencies:
        - name: split_snapshot
          values:
            - true
    - name: snapshotname_task7
      label: Snapshot Name
      type: text
      required: true
      dependencies:
        - name: split_snapshot
          values:
            - true
  source: storage.yaml
